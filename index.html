<!DOCTYPE html>
<html>

<head>
    <title>GREEN-API Test</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="controls">

            <h1>GREEN-API</h1>
            <p>Тестовое задание</p>

            <label for="idInstance">idInstance</label>
            <input type="text" id="idInstance">

            <label for="apiTokenInstance">ApiTokenInstance</label>
            <input type="text" id="apiTokenInstance">
            <button id="getSettingsButton">getSettings</button>
            <button id="getStateInstanceButton">getStateInstance</button>
            <label for="chatId">chatId</label>
            <input type="text" id="chatId">

            <label for="message">message</label>
            <textarea id="message"></textarea>

            <button id="sendMessageButton">sendMessage</button>

            <label for="fileChatId">chatId</label>
            <input type="text" id="fileChatId">

            <label for="fileUrl">URL файла</label>
            <input type="text" id="fileUrl">

            <button id="sendFileByUrlButton">sendFileByUrl</button>
        </div>

        <div class="response-panel">
            <label for="response">Ответ:</label>
            <textarea id="response" readonly></textarea>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
