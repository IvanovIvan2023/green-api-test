<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GREEN-API Test</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="controls">

            <h1>GREEN-API</h1>
            <p>Тестовое задание</p>

            <label for="idInstance">idInstance</label>
            <input type="text" id="idInstance" placeholder="Введите idInstance">

            <label for="apiTokenInstance">ApiTokenInstance</label>
            <input type="text" id="apiTokenInstance" placeholder="Введите ApiTokenInstance">

            <button id="getSettingsButton">getSettings</button>
            <button id="getStateInstanceButton">getStateInstance</button>

            <label for="chatId">chatId</label>
            <input type="text" id="chatId" placeholder="Например: 77771234567@c.us">

            <label for="message">message</label>
            <textarea id="message" placeholder="Введите сообщение"></textarea>

            <button id="sendMessageButton">sendMessage</button>

            <label for="fileChatId">chatId</label>
            <input type="text" id="fileChatId" placeholder="Например: 77771234567@c.us">

            <label for="fileUrl">URL файла</label>
            <input type="text" id="fileUrl" placeholder="https://example.com/file.jpg">

            <label for="fileName">Имя файла</label>
            <input type="text" id="fileName" placeholder="Например: photo.jpg">

            <button id="sendFileByUrlButton">sendFileByUrl</button>

        </div>

        <div class="response-panel">
            <label for="response">Ответ:</label>
            <textarea id="response" readonly></textarea>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
